<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全链扫描 · 大金狗实时版</title>
<style>
:root {
  --bg-main: #0a0e27;
  --bg-section-prime: rgba(255, 215, 0, 0.04);
  --bg-section-all: rgba(0, 212, 255, 0.03);
  --accent-gold: #ffd700;
  --accent-cyan: #00d4ff;
  --platinum: #e5e4e2;
  --ok: #00e080;
  --warn: #ffcc00;
  --danger: #ff4455;
  --text-primary: #e6f0ff;
  --text-secondary: #7a8ab8;
  --avatar-size: 48px;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  background: radial-gradient(circle at top left, #141d42, #0a0e27 60%);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1280px; margin: 0 auto; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
.ctrl-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2);
  color: var(--accent-cyan); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: 0.25s; font-size: 0.85rem;
}
.btn:hover { background: rgba(0, 212, 255, 0.15); }
.sound-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #1e2548; border-radius: 11px; transition: 0.3s;
}
.slider:before {
  content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
  background: white; border-radius: 50%; transition: 0.3s;
}
input:checked + .slider { background: var(--ok); }
input:checked + .slider:before { transform: translateX(18px); }

.banner {
  background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 0.85rem;
}
.banner strong { color: var(--accent-cyan); }
.update-hint { font-size: 0.75rem; color: var(--text-secondary); }
.status-ok { color: var(--ok); }
.status-err { color: var(--danger); }
.status-warn { color: var(--warn); }

.section-prime {
  background: var(--bg-section-prime);
  border: 1px solid rgba(255, 215, 0, 0.18);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 24px;
}
.section-all {
  background: var(--bg-section-all);
  border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.section-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.prime-title { color: var(--accent-gold); font-size: 1rem; font-weight: 700; }
.all-title { color: var(--accent-cyan); font-size: 1rem; font-weight: 700; }
.section-desc { font-size: 0.75rem; opacity: 0.6; margin-left: auto; font-weight: 400; }

.table-header {
  display: grid;
  grid-template-columns: 56px 130px 2fr 110px 150px 140px;
  gap: 10px; padding: 8px 6px; color: var(--text-secondary); font-size: 0.75rem;
}
.row {
  display: grid;
  grid-template-columns: 56px 130px 2fr 110px 150px 140px;
  gap: 10px; padding: 14px 6px; margin-bottom: 4px;
  background: rgba(255, 255, 255, 0.03); border-radius: 8px; align-items: center;
  position: relative; overflow: hidden;
  opacity: 0; transform: translateX(15px); transition: all 0.4s ease;
}
.row.visible { opacity: 1; transform: translateX(0); }
.row:hover { background: rgba(255, 255, 255, 0.06); }
.row.new-in {
  background: rgba(0, 212, 255, 0.06);
  animation: flashNew 2s ease;
}
@keyframes flashNew {
  0% { box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.3); }
  100% { box-shadow: none; }
}

.avatar-wrap { position: relative; display: flex; justify-content: center; }
.avatar {
  width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%;
  object-fit: cover; background: #1e2548; border: 2px solid rgba(255,255,255,0.1);
  transition: transform 0.3s ease;
}
.avatar-ring {
  position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
  opacity: 0; transition: all 0.4s ease;
}
.row.top-gold .avatar-ring {
  border-color: var(--accent-gold); border-width: 3px; opacity: 1;
  animation: pulseGold 1.1s infinite; box-shadow: 0 0 14px rgba(255, 215, 0, 0.4);
}
.row.top-gold .avatar { transform: scale(1.12); }
.row.prime .avatar-ring {
  border-color: var(--platinum); border-width: 3px; opacity: 1;
  animation: pulsePrime 1.5s infinite;
}
.row.prime .avatar { transform: scale(1.06); }
.row.ok .avatar-ring {
  border-color: var(--ok); opacity: 1; animation: pulseOk 2.2s infinite;
}
.row.resonance .avatar-ring {
  border-color: var(--accent-cyan); border-width: 3px; opacity: 1;
  animation: pulseRes 1.6s infinite;
}
.row.resonance .avatar { transform: scale(1.05); }
.row.warn .avatar-ring {
  border-color: var(--warn); opacity: 1; animation: pulseSlow 3s infinite;
}
.row.danger .avatar-ring {
  border-color: var(--danger); opacity: 0.7; animation: none;
}
@keyframes pulseGold {
  0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6); }
  50% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
}
@keyframes pulsePrime {
  0% { box-shadow: 0 0 0 0 rgba(229, 228, 226, 0.45); }
  70% { box-shadow: 0 0 0 9px rgba(229, 228, 226, 0); }
  100% { box-shadow: 0 0 0 0 rgba(229, 228, 226, 0); }
}
@keyframes pulseOk {
  0% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(0, 224, 128, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0); }
}
@keyframes pulseRes {
  0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.45); }
  70% { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
}
@keyframes pulseSlow {
  0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.25); }
  70% { box-shadow: 0 0 0 6px rgba(255, 204, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
}

.coin-name { font-weight: 600; font-size: 1rem; }
.chain-tag {
  display: inline-block; background: rgba(255,255,255,0.06); padding: 2px 8px;
  border-radius: 6px; font-size: 0.7rem; margin-left: 6px;
}
.addr-full {
  font-family: monospace; font-size: 0.7rem; color: #9aa8d0;
  margin-top: 3px; word-break: break-all;
}
.cap { font-family: monospace; font-size: 1rem; font-weight: 500; }
.cap.up { color: var(--ok); }
.cap.down { color: var(--danger); }
.grade-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px;
  font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.25s;
}
.grade-tag.top-gold { background: rgba(255, 215, 0, 0.12); color: var(--accent-gold); border: 1px solid rgba(255, 215, 0, 0.25); }
.grade-tag.prime { background: rgba(229, 228, 226, 0.1); color: var(--platinum); border: 1px solid rgba(229, 228, 226, 0.2); }
.grade-tag.ok { background: rgba(0, 224, 128, 0.1); color: var(--ok); border: 1px solid rgba(0, 224, 128, 0.2); }
.grade-tag.warn { background: rgba(255, 204, 0, 0.08); color: var(--warn); border: 1px solid rgba(255, 204, 0, 0.18); }
.grade-tag.danger { background: rgba(255, 68, 85, 0.1); color: var(--danger); border: 1px solid rgba(255, 68, 85, 0.2); }
.action-links { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { font-size: 0.75rem; color: var(--accent-cyan); text-decoration: none; border-bottom: 1px dashed rgba(0, 212, 255, 0.3); }
.link-btn:hover { border-bottom-style: solid; }
.detail-row {
  grid-column: 1 / -1; background: rgba(8, 12, 32, 0.7); border-radius: 10px; margin-top: 8px; padding: 14px;
  display: none; font-size: 0.85rem; line-height: 1.7;
}
.row.expanded .detail-row { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.empty-tip { padding: 30px; text-align: center; color: var(--text-secondary); font-size: 0.85rem; }

@media (max-width: 1000px) {
  .table-header, .row { grid-template-columns: 56px 120px 1.5fr 100px 110px; }
  .table-header span:nth-child(6), .row > div:nth-child(6) { display: none; }
}
@media (max-width: 600px) {
  .table-header, .row { grid-template-columns: 56px 110px 1.5fr 100px; }
  .table-header span:nth-child(5), .row > div:nth-child(5) { display: none; }
  :root { --avatar-size: 42px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>🚀 全链扫描 · 大金狗实时版</h1>
    <div class="ctrl-group">
      <label class="sound-label">
        🔊 声音提醒
        <label class="switch">
          <input type="checkbox" id="soundSwitch" checked>
          <span class="slider"></span>
        </label>
      </label>
      <button class="btn" id="clearBtn">清提醒</button>
      <span class="update-hint" id="updateHint">上次更新：--</span>
    </div>
  </div>

  <div class="banner">
    <div>📡 数据源：<strong id="sourceStatus">连接中...</strong></div>
    <div>盯币：<strong id="watchCount">0</strong> · 精选：<strong id="primeCount">0</strong></div>
  </div>

  <div class="section-prime">
    <div class="section-header">
      <span class="prime-title">🏆 大金狗精选 · 顶级/优质/共振</span>
      <span class="section-desc">自动筛选高潜力币种</span>
    </div>
    <div class="table-header">
      <span>头像</span>
      <span>币种/链</span>
      <span>合约地址</span>
      <span>市值</span>
      <span>评级</span>
      <span>操作</span>
    </div>
    <div id="primeList"></div>
    <div id="emptyPrime" class="empty-tip">暂未筛选到符合条件币种</div>
  </div>

  <div class="section-all">
    <div class="section-header">
      <span class="all-title">🔍 全链扫描区 · 热门/新币</span>
      <span class="section-desc">ETH / BSC / SOL / BASE / ARB 实时覆盖</span>
    </div>
    <div class="table-header">
      <span>头像</span>
      <span>币种/链</span>
      <span>合约地址</span>
      <span>市值</span>
      <span>评级/状态</span>
      <span>操作</span>
    </div>
    <div id="allList"></div>
  </div>
</div>

<script>
const CONFIG = {
  AUTO_REFRESH_SEC: 30,
  TOP_TOKENS_LIMIT: 50,
  SOUND_ENABLED: true,
  POOL_OK: 50,
  VOLUME_OK: 10,
  RES_OK: 2,
  COOLDOWN: 3600000,
  HIGHLIGHT: 5000
};

const CHAIN_MAP = {
  'ethereum': 'ETH', 'bsc': 'BSC', 'solana': 'SOL', 'base': 'BASE',
  'arbitrum': 'ARB', 'polygon': 'POLYGON', 'avalanche': 'AVAX', 'optimism': 'OP'
};

const CHAIN_EXPLORER = {
  'ETH': 'https://etherscan.io/token/',
  'BSC': 'https://bscscan.com/token/',
  'SOL': 'https://dexscreener.com/solana/',
  'BASE': 'https://basescan.org/token/',
  'ARB': 'https://arbiscan.io/token/',
  'POLYGON': 'https://polygonscan.com/token/',
  'AVAX': 'https://snowtrace.io/address/',
  'OP': 'https://optimistic.etherscan.io/token/'
};

const DEFAULT_AVATAR = 'https://cdn-icons-png.flaticon.com/512/1046/1046754.png';
const notified = new Map();
const synth = window.speechSynthesis;
let audioCtx = null;
let lastTokenIds = new Set();

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function beep(freq = 880, dur = 0.2) {
  if (!CONFIG.SOUND_ENABLED || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + dur);
}
function say(text) {
  if (!CONFIG.SOUND_ENABLED || synth.speaking) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.volume = 0.7; u.rate = 1.05;
  synth.speak(u);
}

// ✅ 用代理接口，直接双击打开也不会跨域
async function fetchDexScreenerData() {
  const urls = [
    'https://api.allorigins.win/raw?url=https://api.dexscreener.com/latest/dex/search?q=*',
    'https://corsproxy.io/?https://api.dexscreener.com/latest/dex/search?q=*'
  ];
  
  for (const url of urls) {
    try {
      const res = await fetch(url, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
      });
      if (!res.ok) continue;
      const json = await res.json();
      if (json.pairs) {
        document.getElementById('sourceStatus').textContent = '实时连接正常';
        document.getElementById('sourceStatus').className = 'status-ok';
        return json.pairs;
      }
    } catch (e) { continue; }
  }
  
  document.getElementById('sourceStatus').textContent = '连接失败，请检查网络';
  document.getElementById('sourceStatus').className = 'status-err';
  return null;
}

function normalizePairs(pairs) {
  if (!pairs) return [];
  const tokenMap = new Map();
  
  for (const p of pairs) {
    if (!p.baseToken) continue;
    const chainRaw = p.chainId || 'unknown';
    const chain = CHAIN_MAP[chainRaw] || chainRaw.toUpperCase();
    const addr = p.baseToken.address || 'unknown';
    const id = `${chain}_${addr}`;
    if (tokenMap.has(id)) continue;
    
    const liquidityUsd = (p.liquidity?.usd || 0) / 10000;
    const volume24h = (p.volume?.h24 || 0) / 10000;
    const marketCap = (p.fdv || 0) / 10000;
    const priceChange24h = p.priceChange?.h24 || 0;
    const isNew = (p.pairCreatedAt && Date.now() - p.pairCreatedAt < 86400000);
    const hasGoodLiq = liquidityUsd >= CONFIG.POOL_OK;
    const hasGoodVol = volume24h >= CONFIG.VOLUME_OK;
    const priceUp = priceChange24h > 0;
    const isResonance = [hasGoodLiq, hasGoodVol, priceUp, isNew].filter(Boolean).length >= CONFIG.RES_OK;
    
    let grade, label;
    if (isResonance && hasGoodLiq && hasGoodVol && priceUp && isNew) {
      grade = 'top-gold'; label = '🏆🔥 顶级金狗';
    } else if (isResonance && hasGoodLiq && hasGoodVol) {
      grade = 'prime'; label = '🥇 优质潜力';
    } else if (isResonance && hasGoodLiq) {
      grade = 'ok'; label = '🟢 共振可进';
    } else if (hasGoodLiq) {
      grade = 'ok'; label = '🟢 可关注';
    } else if (liquidityUsd >= 10) {
      grade = 'warn'; label = '⏳ 观察确认';
    } else {
      grade = 'danger'; label = '🚫 流动性弱';
    }
    
    tokenMap.set(id, {
      id, symbol: p.baseToken.symbol || '???', name: p.baseToken.name || '',
      chain, contractAddress: addr, marketCap, liquidityUsd, volume24h,
      priceChange24h, isNew, isResonance, grade, label,
      avatar: p.baseToken.thumb || p.baseToken.small || null
    });
  }
  return Array.from(tokenMap.values())
    .sort((a, b) => (b.liquidityUsd + b.volume24h) - (a.liquidityUsd + a.volume24h))
    .slice(0, CONFIG.TOP_TOKENS_LIMIT);
}

function fmtMoney(wan) {
  if (wan >= 10000) return (wan / 10000).toFixed(2) + '亿';
  if (wan >= 1) return wan.toFixed(2) + '万';
  return (wan * 10000).toFixed(0);
}

function getExplorerLink(item) {
  const base = CHAIN_EXPLORER[item.chain] || '';
  return base ? `${base}${item.contractAddress}` : '#';
}

function buildRow(item, isNewToken = false) {
  const row = document.createElement('div');
  row.className = `row ${item.grade}`;
  if (item.isResonance) row.classList.add('resonance');
  if (isNewToken) row.classList.add('new-in');
  
  const imgSrc = item.avatar || DEFAULT_AVATAR;
  const priceClass = item.priceChange24h >= 0 ? 'up' : 'down';
  
  row.innerHTML = `
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" src="${imgSrc}" alt="${item.symbol}" onerror="this.src='${DEFAULT_AVATAR}'">
    </div>
    <div>
      <div class="coin-name">${item.symbol}<span class="chain-tag">${item.chain}</span></div>
      <div class="addr-full" title="${item.contractAddress}">${item.contractAddress}</div>
    </div>
    <div></div>
    <div class="cap ${priceClass}">$${fmtMoney(item.marketCap)}</div>
    <div>
      <div class="grade-tag ${item.grade}" title="点击展开详情">${item.label} ▾</div>
      <div class="detail-row">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div>💰 流动性：${item.liquidityUsd.toFixed(2)}万 ${item.liquidityUsd >= CONFIG.POOL_OK ? '✅' : '❌'}</div>
          <div>📈 24h成交：${item.volume24h.toFixed(2)}万 ${item.volume24h >= CONFIG.VOLUME_OK ? '✅' : '❌'}</div>
          <div>📊 24h涨跌：${item.priceChange24h >= 0 ? '+' : ''}${item.priceChange24h.toFixed(2)}% ${item.priceChange24h > 0 ? '✅' : '❌'}</div>
          <div>🆕 新币(24h内)：${item.isNew ? '✅' : '❌'}</div>
        </div>
        <div><strong>链/合约：</strong>${item.chain} / ${item.contractAddress}<br><strong>共振信号：</strong>${item.isResonance ? '✅ 已触发' : '❌ 未达标'}</div>
      </div>
    </div>
    <div class="action-links">
      <a href="${getExplorerLink(item)}" target="_blank" class="link-btn">去链上</a>
      <a href="${getExplorerLink(item)}" target="_blank" class="link-btn">看趋势</a>
    </div>
  `;
  
  row.querySelector('.grade-tag').addEventListener('click', () => {
    row.classList.toggle('expanded');
  });
  
  setTimeout(() => row.classList.add('visible'), 10);
  
  if (isNewToken && (!notified.has(item.id) || Date.now() - notified.get(item.id) > CONFIG.COOLDOWN)) {
    notified.set(item.id, Date.now());
    if (item.grade === 'top-gold' || item.grade === 'prime') {
      beep(960); setTimeout(() => beep(1200), 150);
      setTimeout(() => say(`${item.grade.includes('顶级') ? '顶级金狗' : '优质新币'} ${item.symbol} ${item.chain}`), 400);
    }
  }
  return row;
}

function getPrimeOnly(list) {
  return list.filter(i => ['top-gold', 'prime', 'ok'].includes(i.grade) && i.isResonance);
}

function renderAll(data, isFresh = false) {
  document.getElementById('allList').innerHTML = '';
  document.getElementById('primeList').innerHTML = '';
  const prime = getPrimeOnly(data);
  
  if (prime.length > 0) {
    document.getElementById('emptyPrime').style.display = 'none';
    document.getElementById('primeCount').textContent = prime.length;
    prime.forEach(item => {
      const isNew = isFresh && !lastTokenIds.has(item.id);
      document.getElementById('primeList').appendChild(buildRow(item, isNew));
    });
  } else {
    document.getElementById('emptyPrime').style.display = 'block';
    document.getElementById('primeCount').textContent = '0';
  }
  
  data.forEach(item => {
    const isNew = isFresh && !lastTokenIds.has(item.id);
    document.getElementById('allList').appendChild(buildRow(item, isNew));
  });
  
  lastTokenIds = new Set(data.map(i => i.id));
  document.getElementById('watchCount').textContent = data.length;
  document.getElementById('updateHint').textContent = '上次更新：' + new Date().toLocaleTimeString('zh-CN');
}

async function updateLoop() {
  const pairs = await fetchDexScreenerData();
  if (!pairs) return;
  renderAll(normalizePairs(pairs), true);
}

document.getElementById('clearBtn').addEventListener('click', () => {
  notified.clear();
  alert('提醒记录已清除');
});
document.getElementById('soundSwitch').addEventListener('change', e => {
  CONFIG.SOUND_ENABLED = e.target.checked;
  if (CONFIG.SOUND_ENABLED) initAudio();
});
document.addEventListener('click', initAudio, { once: true });

updateLoop();
setInterval(updateLoop, CONFIG.AUTO_REFRESH_SEC * 1000);

console.log('%c===== 全链大金狗 · 直接双击即用 =====', 'color:#00d4ff;font-weight:bold;');
console.log('已启用跨域代理，直接双击打开即可自动刷新数据');
</script>
</body>
</html>
