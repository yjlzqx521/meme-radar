<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOG HUNTER 精简版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif}
:root{--cyan:#00e5ff;--gold:#ffb800;--green:#00d084;--red:#ff4d4f;--bg:#050a18;--card:rgba(10,25,50,.7);--border:rgba(0,229,255,.25);--text:#e6f7ff;--sub:#7ab8d6}
body{background:var(--bg);color:var(--text);padding:10px;line-height:1.5}
h1{font-size:18px;margin-bottom:10px;color:var(--cyan)}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
label{font-size:12px;color:var(--sub)}
input,button{background:rgba(0,0,0,.4);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px}
button{cursor:pointer;font-weight:bold}
.btn-gold{background:linear-gradient(90deg,#cc9200,var(--gold));color:#000;border:none}
.btn-cyan{background:linear-gradient(90deg,#0099aa,var(--cyan));color:#000;border:none}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat-card{padding:10px;border-radius:6px;background:rgba(0,0,0,.3);text-align:center}
.stat-val{font-size:20px;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid rgba(0,229,255,.1)}
th{color:var(--sub);font-size:12px}
.new-row{animation:fadeIn .4s ease}
@keyframes fadeIn{0%{opacity:0;transform:translateY(-5px)}100%{opacity:1}}
.log{max-height:150px;overflow-y:auto;font-size:11px;line-height:2;margin-top:8px}
.log p{border-bottom:1px solid rgba(255,255,255,.05);padding:2px 0}
.ok{color:var(--green)}.warn{color:var(--gold)}.err{color:var(--red)}.cyan{color:var(--cyan)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,208,132,.4)}70%{box-shadow:0 0 0 6px transparent}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{padding:6px 12px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.tab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.1)}
</style>
</head>
<body>

<h1>🐶 DOG HUNTER · 动态精简版</h1>

<div class="card">
  <div class="tabs">
    <div class="tab active" data-chain="all">全部链</div>
    <div class="tab" data-chain="bsc">BSC</div>
    <div class="tab" data-chain="sol">SOL</div>
    <div class="tab" data-chain="base">BASE</div>
  </div>

  <div class="row">
    <label>最低流动性$：</label>
    <input type="number" id="minLiq" value="300" style="width:80px">
    <label>刷新秒：</label>
    <input type="number" id="interval" value="8" style="width:60px">
    <button id="apply" class="btn-gold">✅ 应用</button>
    <button id="refresh" class="btn-cyan">🔄 立即刷新</button>
    <label style="margin-left:auto">
      <input type="checkbox" id="auto" checked> 自动刷新
    </label>
  </div>
</div>

<div class="stat">
  <div class="stat-card"><div>巡检轮次</div><div class="stat-val" id="round">0</div></div>
  <div class="stat-card"><div>今日新币</div><div class="stat-val" id="new">0</div></div>
  <div class="stat-card"><div>已过滤</div><div class="stat-val" id="filtered">0</div></div>
  <div class="stat-card"><div>状态</div><div class="stat-val" id="status"><span class="pulse"></span>监听</div></div>
</div>

<div class="card">
  <b>📋 捕获列表</b>
  <table>
    <thead><tr><th>币种</th><th>链</th><th>流动性$</th><th>市值$</th><th>发现</th><th>链接</th></tr></thead>
    <tbody id="list"><tr><td colspan="6" style="color:var(--sub)">点「立即刷新」开始...</td></tr></tbody>
  </table>
</div>

<div class="card">
  <b>📈 实时动态流</b>
  <div class="log" id="log">
    <p class="cyan">[就绪] 精简版启动</p>
  </div>
</div>

<script>
const CONFIG={
  minLiq:300,interval:8000,
  chains:{bsc:{id:'bsc'},sol:{id:'solana'},base:{id:'base'}},
  black:['scam','fake','copy','airdrop','rug'],white:[],seen:new Set()
};
let allCoins=[],totalNew=0,totalFilter=0,round=0,timer=null,activeChain='all';

function fmt(n){if(!n&&n!==0)return'--';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(2)+'K';return n.toFixed(0)}
function time(){return new Date().toLocaleTimeString().slice(0,8)}
function log(txt,cls='cyan'){const el=document.getElementById('log');el.insertAdjacentHTML('afterbegin',`<p class="${cls}">[${time()}] ${txt}</p>`);if(el.children.length>40)el.removeChild(el.lastChild)}

async function fetchChain(name){
  const res=await fetch(`https://api.dexscreener.com/latest/dex/search?q=${CONFIG.chains[name].id}&limit=40`);
  if(!res.ok)return[];
  const d=await res.json();
  return(d.pairs||[]).filter(p=>p.chainId===CONFIG.chains[name].id).map(p=>({...p,_chain:name}));
}

async function update(){
  round++;
  document.getElementById('round').textContent=round;
  document.getElementById('status').innerHTML='<span class="pulse"></span>刷新中';
  let pairs=[];
  for(const k of Object.keys(CONFIG.chains)){
    log(`巡检 ${k.toUpperCase()}...`,'cyan');
    pairs=pairs.concat(await fetchChain(k));
  }
  let newCount=0,filterCount=0;
  for(const p of pairs){
    const addr=p.baseToken?.address;
    if(!addr){filterCount++;continue}
    const low=addr.toLowerCase();
    if(CONFIG.seen.has(low))continue;
    const name=((p.baseToken?.name||'')+' '+(p.baseToken?.symbol||'')).toLowerCase();
    if(CONFIG.black.some(w=>name.includes(w))){filterCount++;continue}
    if(CONFIG.white.length&&!CONFIG.white.some(w=>name.includes(w))){filterCount++;continue}
    if((p.liquidity?.usd||0)<CONFIG.minLiq){filterCount++;continue}
    CONFIG.seen.add(low);
    allCoins.unshift({
      symbol:p.baseToken?.symbol||'?',name:p.baseToken?.name||'?',chain:p._chain,
      liq:p.liquidity?.usd||0,mcap:p.fdv?.usd,time:p.createdAt,addr
    });
    newCount++;totalNew++;
    log(`🆕 ${p.baseToken?.symbol} | ${p._chain} | $${fmt(p.liquidity?.usd)}`,'ok');
  }
  totalFilter+=filterCount;
  render();
  document.getElementById('new').textContent=totalNew;
  document.getElementById('filtered').textContent=totalFilter;
  document.getElementById('status').innerHTML='<span class="pulse"></span>正常';
  log(`第${round}轮完成 · 新币${newCount} · 过滤${filterCount}`,'ok');
}

function render(){
  const list=activeChain==='all'?allCoins:allCoins.filter(c=>c.chain===activeChain);
  const tb=document.getElementById('list');
  tb.innerHTML='';
  if(!list.length){tb.innerHTML=`<tr><td colspan="6" style="color:var(--sub)">暂无数据</td></tr>`;return}
  list.slice(0,15).forEach(c=>{
    tb.insertAdjacentHTML('beforeend',`<tr class="new-row">
      <td><b>${c.symbol}</b><br><small style="color:var(--sub)">${c.name.slice(0,12)}</small></td>
      <td>${c.chain.toUpperCase()}</td>
      <td>$${fmt(c.liq)}</td>
      <td>$${fmt(c.mcap)}</td>
      <td style="font-size:11px;color:var(--sub)">${c.time?new Date(c.time).toLocaleDateString():'--'}</td>
      <td><a href="https://gmgn.ai/${c.chain}/token/${c.addr}" target="_blank" style="color:var(--cyan)">GMGN</a></td>
    </tr>`);
  });
}

// 事件
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  activeChain=t.dataset.chain;
  render();
});
document.getElementById('refresh').onclick=update;
document.getElementById('apply').onclick=()=>{
  CONFIG.minLiq=parseInt(document.getElementById('minLiq').value)||300;
  CONFIG.interval=(parseInt(document.getElementById('interval').value)||8)*1000;
  if(timer){clearInterval(timer);timer=setInterval(update,CONFIG.interval)}
  log(`设置已应用 · 流动性≥$${CONFIG.minLiq}`,'warn');
};
document.getElementById('auto').onchange=()=>{
  if(document.getElementById('auto').checked)timer=setInterval(update,CONFIG.interval);
  else{clearInterval(timer);timer=null;log('自动刷新已关闭','warn')}
};
// 启动
timer=setInterval(update,CONFIG.interval);
</script>
</body>
</html>
