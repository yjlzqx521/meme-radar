<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土狗扫描台 · 全链大金狗终极版</title>
<style>
:root {
  --bg-main: #0a0e27;
  --bg-card: #101636;
  --bg-row: rgba(16, 22, 54, 0.6);
  --accent-cyan: #00d4ff;
  --gold: #ffd700;
  --platinum: #e5e4e2;
  --ok: #00e080;
  --warn: #ffcc00;
  --danger: #ff4455;
  --text-primary: #e6f0ff;
  --text-secondary: #7a8ab8;
  --avatar-size: 48px;
  --radius: 12px;
  --chain-badge: #2a2f50;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  background: radial-gradient(circle at top left, #141d42, #0a0e27 60%);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1280px; margin: 0 auto; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
.ctrl-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2);
  color: var(--accent-cyan); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: 0.25s; font-size: 0.85rem;
}
.btn:hover { background: rgba(0, 212, 255, 0.15); }
.sound-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #1e2548; border-radius: 22px; transition: 0.3s;
}
.slider:before {
  content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
  background: white; border-radius: 50%; transition: 0.3s;
}
input:checked + .slider { background: var(--ok); }
input:checked + .slider:before { transform: translateX(18px); }

.banner {
  background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 0.85rem;
}
.banner strong { color: var(--accent-cyan); }

.section-title {
  font-size: 1rem; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px;
  color: var(--accent-cyan);
}
.section-title.top { margin-top: 0; }
.gold-badge {
  background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
  color: #000; padding: 2px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;
}
.chain-tag {
  display: inline-block; background: var(--chain-badge); padding: 2px 8px;
  border-radius: 6px; font-size: 0.7rem; margin-left: 6px;
}
.addr-full {
  font-family: monospace; font-size: 0.72rem; color: #9aa8d0;
  margin-top: 2px; word-break: break-all;
}

.table-header {
  display: grid;
  grid-template-columns: 56px 130px 1.8fr 110px 140px 140px;
  gap: 10px; padding: 8px 12px; color: var(--text-secondary); font-size: 0.75rem;
  border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px;
}
.row {
  display: grid;
  grid-template-columns: 56px 130px 1.8fr 110px 140px 140px;
  gap: 10px; padding: 12px; margin-bottom: 8px;
  background: var(--bg-row); border-radius: var(--radius); align-items: center;
  position: relative; overflow: hidden;
  opacity: 0; transform: translateX(20px); transition: all 0.4s ease;
  border: 1px solid transparent;
}
.row.visible { opacity: 1; transform: translateX(0); }
.row:hover { background: rgba(20, 28, 68, 0.8); border-color: rgba(255,255,255,0.06); }
.row::before {
  content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
}
.row.new-in::before {
  left: 100%; transition: left 0.7s ease;
}

/* 头像与呼吸 */
.avatar-wrap { position: relative; display: flex; justify-content: center; }
.avatar {
  width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%;
  object-fit: cover; background: #1e2548; border: 2px solid rgba(255,255,255,0.1);
  transition: transform 0.3s ease;
}
.avatar-ring {
  position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
  opacity: 0; transition: all 0.4s ease;
}
.row.top-gold .avatar-ring {
  border-color: var(--gold); border-width: 3px; opacity: 1;
  animation: pulseGold 1.1s infinite; box-shadow: 0 0 14px rgba(255, 215, 0, 0.4);
}
.row.top-gold .avatar { transform: scale(1.12); }
.row.prime .avatar-ring {
  border-color: var(--platinum); border-width: 3px; opacity: 1;
  animation: pulsePrime 1.5s infinite;
}
.row.prime .avatar { transform: scale(1.06); }
.row.ok .avatar-ring {
  border-color: var(--ok); opacity: 1; animation: pulseOk 2.2s infinite;
}
.row.resonance .avatar-ring {
  border-color: var(--accent-cyan); border-width: 3px; opacity: 1; animation: pulseRes 1.6s infinite;
}
.row.resonance .avatar { transform: scale(1.05); }
.row.warn .avatar-ring {
  border-color: var(--warn); opacity: 1; animation: pulseSlow 3s infinite;
}
.row.danger .avatar-ring {
  border-color: var(--danger); opacity: 0.7; animation: none;
}
@keyframes pulseGold {
  0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.6); }
  50% { box-shadow: 0 0 0 12px rgba(255, 215, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
}
@keyframes pulsePrime {
  0% { box-shadow: 0 0 0 0 rgba(229, 228, 226, 0.45); }
  70% { box-shadow: 0 0 0 9px rgba(229, 228, 226, 0); }
  100% { box-shadow: 0 0 0 0 rgba(229, 228, 226, 0); }
}
@keyframes pulseOk {
  0% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(0, 224, 128, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0); }
}
@keyframes pulseRes {
  0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.45); }
  70% { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
}
@keyframes pulseSlow {
  0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.25); }
  70% { box-shadow: 0 0 0 6px rgba(255, 204, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
}

.coin-name { font-weight: 600; font-size: 1rem; }
.coin-full { font-size: 0.7rem; color: var(--text-secondary); opacity: 0; height: 0; overflow: hidden; transition: all 0.25s ease; }
.row:hover .coin-full { opacity: 1; height: auto; margin-top: 2px; }

.cap { font-family: monospace; font-size: 1rem; font-weight: 500; }
.cap.up { color: var(--ok); }
.cap.down { color: var(--danger); }

.grade-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px;
  font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.25s;
}
.grade-tag.top-gold { background: rgba(255, 215, 0, 0.12); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.25); }
.grade-tag.prime { background: rgba(229, 228, 226, 0.1); color: var(--platinum); border: 1px solid rgba(229, 228, 226, 0.2); }
.grade-tag.ok { background: rgba(0, 224, 128, 0.1); color: var(--ok); border: 1px solid rgba(0, 224, 128, 0.2); }
.grade-tag.warn { background: rgba(255, 204, 0, 0.08); color: var(--warn); border: 1px solid rgba(255, 204, 0, 0.18); }
.grade-tag.danger { background: rgba(255, 68, 85, 0.1); color: var(--danger); border: 1px solid rgba(255, 68, 85, 0.2); }
.action-links { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { font-size: 0.75rem; color: var(--accent-cyan); text-decoration: none; border-bottom: 1px dashed rgba(0, 212, 255, 0.3); }
.link-btn:hover { border-bottom-style: solid; }

.detail-row {
  grid-column: 1 / -1; background: rgba(8, 12, 32, 0.7); border-radius: 10px; margin-top: 8px; padding: 14px;
  display: none; font-size: 0.85rem; line-height: 1.7;
}
.row.expanded .detail-row { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

.empty-tip { padding: 30px; text-align: center; color: var(--text-secondary); font-size: 0.85rem; }

@media (max-width: 1000px) {
  .table-header, .row { grid-template-columns: 56px 120px 1.5fr 100px 110px; }
  .table-header span:nth-child(6), .row > div:nth-child(6) { display: none; }
}
@media (max-width: 600px) {
  .table-header, .row { grid-template-columns: 56px 110px 1.5fr 100px; }
  .table-header span:nth-child(5), .row > div:nth-child(5) { display: none; }
  :root { --avatar-size: 42px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>🚀 全链扫描 · 大金狗终极版</h1>
    <div class="ctrl-group">
      <label class="sound-label">
        🔊 声音提醒
        <label class="switch">
          <input type="checkbox" id="soundSwitch" checked>
          <span class="slider"></span>
        </label>
      </label>
      <button class="btn" id="clearBtn">清提醒</button>
    </div>
  </div>

  <div class="banner">
    <div>📡 监控源：<strong id="sourceCount">24</strong> 个 · 全链扫描中 · 盯币：<strong id="watchCount">0</strong></div>
    <div>过闸率：<strong>73%</strong> · 拦截风险：<strong id="blockCount">22</strong> 个</div>
  </div>

  <!-- 大金狗精选区 -->
  <h2 class="section-title top gold-badge">⚡ 大金狗精选 · 仅顶级/优质/共振</h2>
  <div class="table-header">
    <span>头像</span>
    <span>币种/链</span>
    <span>合约地址</span>
    <span>市值</span>
    <span>评级</span>
    <span>操作</span>
  </div>
  <div id="primeList"></div>
  <div id="emptyPrime" class="empty-tip">暂未筛选到符合条件币种，请等待扫描更新</div>

  <!-- 全量扫描区 -->
  <h2 class="section-title">🔍 全链扫描区（所有链 · 所有信号）</h2>
  <div class="table-header">
    <span>头像</span>
    <span>币种/链</span>
    <span>合约地址</span>
    <span>市值</span>
    <span>评级/状态</span>
    <span>操作</span>
  </div>
  <div id="allList"></div>
</div>

<script>
// ========== 全链配置 ==========
const CHAIN_INFO = {
  ETH: { name: '以太坊', explorer: 'https://etherscan.io/token/' },
  BSC: { name: '币安链', explorer: 'https://bscscan.com/token/' },
  SOL: { name: 'Solana', explorer: 'https://dexscreener.com/solana/' },
  BASE: { name: 'Base', explorer: 'https://basescan.org/token/' },
  ARB: { name: 'Arbitrum', explorer: 'https://arbiscan.io/token/' },
  POLYGON: { name: 'Polygon', explorer: 'https://polygonscan.com/token/' },
  AVAX: { name: 'Avalanche', explorer: 'https://snowtrace.io/address/' },
  UNKNOWN: { name: '未知链', explorer: '' }
};

// ========== 大金狗完整策略 ==========
const CONFIG = {
  SOUND_ENABLED: true,
  POOL_OK: 45,
  BS_OK: 1.5,
  RES_OK: 2,
  RES_STRONG: 3,
  COOLDOWN: 3600000,
  HIGHLIGHT: 5000,
  TP1: 50,
  TP1_RATE: 0.25,
  TP2: 100,
  TP2_RATE: 0.5,
  STOP_LOSS: -15,
  MAX_POS: 50,
  MAX_COINS: 3,
  ADDRESS_GROWTH: 30,
  TOP10_LIMIT: 40
};

// 头像库+稳兜底
const AVATAR = {
  BTC: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png',
  ETH: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png',
  SOL: 'https://assets.coingecko.com/coins/images/4128/small/solana.png',
  BNB: 'https://assets.coingecko.com/coins/images/825/small/bnb-icon2_2x.png',
  USDT: 'https://assets.coingecko.com/coins/images/325/small/Tether.png',
  PEPE: 'https://assets.coingecko.com/coins/images/29851/small/pepe.png',
  WIF: 'https://assets.coingecko.com/coins/images/33697/small/wif.png',
  BONK: 'https://assets.coingecko.com/coins/images/30868/small/bonk.png',
  SHIB: 'https://assets.coingecko.com/coins/images/11938/small/shib.png',
  DOGE: 'https://assets.coingecko.com/coins/images/5/small/dogecoin.png',
  DEFAULT: 'https://cdn-icons-png.flaticon.com/512/1046/1046754.png'
};

const notified = new Map();
const synth = window.speechSynthesis;
let audioCtx = null;
let allCoins = [];

// 音频
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq = 880, dur = 0.2) {
  if (!CONFIG.SOUND_ENABLED || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(audioCtx.currentTime); o.stop(audioCtx.currentTime + dur);
}
function say(text) {
  if (!CONFIG.SOUND_ENABLED || synth.speaking) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.volume = 0.7; u.rate = 1.05;
  synth.speak(u);
}

// 提醒
function alertItem(item) {
  const now = Date.now();
  if (notified.has(item.id) && now - notified.get(item.id) < CONFIG.COOLDOWN) return;
  notified.set(item.id, now);
  if (item.grade === 'top-gold') {
    beep(960); setTimeout(() => beep(1200), 150);
    setTimeout(() => say(`顶级金狗 ${item.symbol} · ${CHAIN_INFO[item.chain]?.name || '未知链'}`), 400);
  } else if (item.grade === 'prime') {
    beep(920); setTimeout(() => say(`优质 ${item.symbol}`), 300);
  } else if (item.isResonance) {
    beep(880); setTimeout(() => say(`共振 ${item.symbol}`), 300);
  } else if (item.grade === 'warn') {
    beep(620); setTimeout(() => say(`${item.symbol} 观察`), 250);
  } else {
    beep(380, 0.3); setTimeout(() => say(`${item.symbol} 风险`), 250);
  }
}

// 大金狗核心判定
function judgeCoin(item) {
  const safe = item.poolRatio >= CONFIG.POOL_OK && 
               item.bsRatio >= CONFIG.BS_OK && 
               !item.isPixi && !item.isHighRise;
  const genes = {
    safe,
    addrGrowth: (item.addrGrowth24h || 0) >= CONFIG.ADDRESS_GROWTH,
    smartMoney: item.smartMoneyBuy === true,
    cleanContract: item.renounced === true && item.lockedLiq === true,
    fairSupply: (item.top10Hold || 99) < CONFIG.TOP10_LIMIT,
    volumeUp: item.priceUp && item.volumeSync === true,
    socialRising: item.socialHeat === true,
    narrative: item.narrativeClear === true
  };
  const score = Object.values(genes).filter(Boolean).length;
  const isRes = (item.sourceCount || 1) >= CONFIG.RES_OK;
  const isStrongRes = (item.sourceCount || 1) >= CONFIG.RES_STRONG;
  
  let grade, label;
  if (score >= 7 && isStrongRes) {
    grade = 'top-gold'; label = '🏆🔥 顶级金狗';
  } else if (score >= 5 && isRes) {
    grade = 'prime'; label = '🥇 优质潜力';
  } else if (safe && isRes) {
    grade = 'ok'; label = '🟢 共振可进';
  } else if (safe) {
    grade = 'ok'; label = '🟢 可关注';
  } else if (score >= 3) {
    grade = 'warn'; label = '⏳ 观察确认';
  } else {
    grade = 'danger'; label = '🚫 回避';
  }
  return { genes, score, grade, label, isRes, isStrongRes };
}

// 工具
function fmtNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
  return n.toFixed(2);
}
function getExplorerLink(item) {
  const base = CHAIN_INFO[item.chain]?.explorer || '';
  return base ? `${base}${item.contractAddress}` : '#';
}
function getAvatar(item) {
  if (item.avatar) return item.avatar;
  return AVATAR[item.symbol.toUpperCase()] || AVATAR.DEFAULT;
}

// 渲染行
function buildRow(item, isNew = false) {
  const info = judgeCoin(item);
  Object.assign(item, info);
  
  const row = document.createElement('div');
  row.className = `row ${item.grade}`;
  if (item.isResonance) row.classList.add('resonance');
  if (isNew) row.classList.add('new-in');
  
  const chainName = CHAIN_INFO[item.chain]?.name || '未知链';
  const explorerLink = getExplorerLink(item);
  const imgSrc = getAvatar(item);
  const priceClass = (item.priceChange || 0) >= 0 ? 'up' : 'down';
  
  row.innerHTML = `
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" src="${imgSrc}" alt="${item.symbol}" onerror="this.src='${AVATAR.DEFAULT}'">
    </div>
    <div>
      <div class="coin-name">${item.symbol}<span class="chain-tag">${item.chain || '?'}</span></div>
      <div class="coin-full">${item.fullName || item.symbol} · ${chainName}</div>
      <div class="addr-full" title="${item.contractAddress}">${item.contractAddress || '未获取'}</div>
    </div>
    <div></div>
    <div class="cap ${priceClass}">$${fmtNumber(item.marketCap || 0)}</div>
    <div>
      <div class="grade-tag ${item.grade}" title="点击查看详情">
        ${item.label} ▾
      </div>
      <div class="detail-row">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div>✅ 池资金≥45%：${item.poolRatio || 0}% ${item.genes.safe?'✅':'❌'}</div>
          <div>✅ 买卖比≥1.5：${item.bsRatio || 0} ${item.genes.safe?'✅':'❌'}</div>
          <div>🧬 地址增长≥30：${item.addrGrowth24h || 0} ${item.genes.addrGrowth?'✅':'❌'}</div>
          <div>🧬 聪明钱买入：${item.genes.smartMoney?'✅':'❌'}</div>
          <div>🧬 合约干净弃权+锁池：${item.genes.cleanContract?'✅':'❌'}</div>
          <div>🧬 筹码分散<40%：前10占${item.top10Hold || '--'}% ${item.genes.fairSupply?'✅':'❌'}</div>
          <div>🧬 量价同步放大：${item.genes.volumeUp?'✅':'❌'}</div>
          <div>🧬 社交热度发酵：${item.genes.socialRising?'✅':'❌'}</div>
        </div>
        <div>
          <strong>止盈止损策略：</strong>上涨+50% 卖出25% / 上涨+100% 卖出50% / 下跌-15% 全部止损<br>
          <strong>合约地址：</strong>${item.contractAddress || '无'}<br>
          <strong>所属链：</strong>${chainName} (${item.chain || 'UNKNOWN'})
        </div>
      </div>
    </div>
    <div class="action-links">
      <a href="${explorerLink}" target="_blank" class="link-btn">去链上</a>
      <a href="${explorerLink}" target="_blank" class="link-btn">看趋势</a>
    </div>
  `;
  
  // 展开详情
  row.querySelector('.grade-tag').addEventListener('click', () => {
    row.classList.toggle('expanded');
  });
  
  setTimeout(() => row.classList.add('visible'), 10);
  if (isNew) {
    setTimeout(() => row.classList.remove('new-in'), CONFIG.HIGHLIGHT);
    alertItem(item);
  }
  
  return row;
}

// 筛选精选
function getPrimeOnly(list) {
  return list.filter(i => ['top-gold', 'prime', 'ok'].includes(i.grade) && i.isResonance);
}

// 渲染全部
function renderAll(data, isFresh = false) {
  allCoins = [...data];
  document.getElementById('allList').innerHTML = '';
  document.getElementById('primeList').innerHTML = '';
  
  const prime = getPrimeOnly(allCoins);
  
  // 精选区
  if (prime.length > 0) {
    document.getElementById('emptyPrime').style.display = 'none';
    prime.forEach(item => {
      const row = buildRow(item, isFresh && !notified.has(item.id));
      document.getElementById('primeList').appendChild(row);
    });
  } else {
    document.getElementById('emptyPrime').style.display = 'block';
  }
  
  // 全量区
  if (allCoins.length > 0) {
    allCoins.forEach(item => {
      const row = buildRow(item, isFresh && !notified.has(item.id));
      document.getElementById('allList').appendChild(row);
    });
  }
  
  document.getElementById('watchCount').textContent = allCoins.length;
}

// ========== 示例数据 —— 对接真实接口替换这里即可 ==========
const DEMO_DATA = [
  {
    id: 'pepe-sol',
    symbol: 'PEPE',
