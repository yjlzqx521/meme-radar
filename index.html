<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE HUNTER · 深空扫描系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }

    :root {
      --cyan: #00e5ff;
      --cyan-deep: #0099cc;
      --gold: #ffb800;
      --gold-light: #ffd700;
      --panel-bg: rgba(8, 22, 48, 0.65);
      --panel-border: rgba(0, 229, 255, 0.25);
      --text-primary: #e6f7ff;
      --text-secondary: #7ab8d6;
      --shadow-cyan: 0 0 20px rgba(0, 229, 255, 0.35);
      --shadow-gold: 0 0 20px rgba(255, 184, 0, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #020617;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(30, 60, 140, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(20, 50, 100, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse at center, #050a20 0%, #020617 70%);
      position: relative;
      color: var(--text-primary);
    }

    /* ✨ 星空层 */
    .stars-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.9; }
    }

    /* 🌌 星云光晕 */
    .nebula {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at 15% 18%, rgba(60, 120, 255, 0.12) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(0, 180, 220, 0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 50% 50%, rgba(10, 40, 90, 0.1) 0%, transparent 60%);
    }

    /* ========== 顶部导航 ========== */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
      background: linear-gradient(180deg, rgba(0, 15, 40, 0.85), transparent);
    }

    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--cyan), var(--cyan-deep));
      clip-path: polygon(0 25%, 25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%);
      box-shadow: var(--shadow-cyan);
    }
    .logo-text { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #fff; text-shadow: 0 0 15px var(--cyan); }

    .nav-menu { display: flex; gap: 45px; margin-left: 60px; }
    .nav-item {
      color: var(--text-secondary); font-size: 15px; letter-spacing: 1px; cursor: pointer;
      padding: 6px 0; border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--cyan); border-bottom-color: var(--cyan);
      text-shadow: 0 0 10px var(--cyan);
    }

    .top-actions { display: flex; align-items: center; gap: 25px; }
    .user-text { font-size: 13px; color: var(--text-secondary); }
    .icon-btn { color: var(--text-secondary); cursor: pointer; transition: color 0.2s; font-size: 18px; }
    .icon-btn:hover { color: var(--cyan); }
    .start-btn {
      background: linear-gradient(90deg, #00b8e6, var(--cyan));
      border: none; padding: 8px 22px; border-radius: 6px;
      color: #000; font-weight: 600; font-size: 14px; cursor: pointer;
      box-shadow: 0 0 15px var(--cyan); transition: all 0.3s;
    }
    .start-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--cyan); }

    /* ========== 左侧面板 ========== */
    .left-panel {
      position: fixed; left: 30px; top: 100px; bottom: 40px; width: 220px; z-index: 50;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 25px 18px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 30px rgba(0, 229, 255, 0.04);
    }
    .left-menu { display: flex; flex-direction: column; gap: 4px; }
    .left-item {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      color: var(--text-secondary); font-size: 14px; border-radius: 4px;
      cursor: pointer; transition: all 0.25s ease;
      border-left: 3px solid transparent;
    }
    .left-item:hover { background: rgba(0, 229, 255, 0.06); color: var(--cyan); }
    .left-item.active {
      background: linear-gradient(90deg, rgba(255, 184, 0, 0.12), rgba(0, 229, 255, 0.04));
      color: var(--gold); border-left-color: var(--gold);
      box-shadow: inset 0 0 12px rgba(255, 184, 0, 0.1);
    }
    .left-item .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.6; }
    .left-item.active .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); opacity: 1; }

    /* ========== 中间雷达核心区 ========== */
    .center-area {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 720px; height: 720px; z-index: 10;
    }

    /* 轨道环 */
    .orbit-ring {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 1px solid rgba(0, 229, 255, 0.15);
    }
    .orbit-1 { width: 220px; height: 220px; }
    .orbit-2 { width: 340px; height: 340px; }
    .orbit-3 { width: 460px; height: 460px; }
    .orbit-4 { width: 580px; height: 580px; }

    /* 发光环渐变 */
    .glow-ring {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 1px solid transparent;
      border-image: linear-gradient(90deg, transparent, var(--cyan), transparent) 1;
      animation: ringGlow 6s infinite linear;
    }
    .glow-ring:nth-child(1) { width: 260px; height: 260px; animation-delay: 0s; }
    .glow-ring:nth-child(2) { width: 380px; height: 380px; animation-delay: 1.5s; }
    .glow-ring:nth-child(3) { width: 500px; height: 500px; animation-delay: 3s; }
    @keyframes ringGlow {
      0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 0.25; }
      50% { opacity: 0.45; }
      100% { transform: translate(-50%, -50%) rotate(360deg); opacity: 0.25; }
    }

    /* 中心空间站核心 */
    .station-core {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 180px; height: 180px;
    }
    .core-base {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, #00e5ff33, #00668822, #0a153000);
      display: flex; align-items: center; justify-content: center;
      animation: corePulse 3s infinite ease-in-out;
    }
    .core-inner {
      width: 90px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00e5ff, #0088aa);
      box-shadow:
        0 0 30px var(--cyan),
        0 0 60px rgba(0, 229, 255, 0.5),
        inset 0 0 20px rgba(255, 255, 255, 0.4);
      animation: coreBright 3s infinite ease-in-out;
    }
    @keyframes corePulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes coreBright {
      0%,100% { box-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0, 229, 255, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.4); }
      50% { box-shadow: 0 0 45px var(--cyan), 0 0 90px rgba(0, 229, 255, 0.7), inset 0 0 30px rgba(255, 255, 255, 0.6); }
    }

    /* 扫描光束 */
    .scan-layer {
      position: absolute; top: 50%; left: 50%; width: 600px; height: 600px;
      margin-top: -300px; margin-left: -300px; border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(0, 229, 255, 0.35) 0deg,
        rgba(0, 229, 255, 0.06) 28deg,
        transparent 45deg
      );
      animation: spinScan 5s linear infinite; pointer-events: none;
    }
    @keyframes spinScan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* 🪐 星球 */
    .planet-wrap { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; }
    .planet {
      position: absolute; width: 70px; height: 70px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #cc8800, #664400);
      box-shadow:
        0 0 25px rgba(255, 184, 0, 0.45),
        inset -8px -8px 20px rgba(0, 0, 0, 0.4),
        inset 8px 8px 20px rgba(255, 255, 200, 0.2);
      cursor: pointer; transition: transform 0.3s; z-index: 20;
    }
    .planet:hover { transform: scale(1.15); }
    .planet-ring {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100px; height: 100px; border-radius: 50%;
      border: 1px solid rgba(255, 184, 0, 0.25);
      animation: orbitRingPulse 3s infinite ease-in-out;
    }
    @keyframes orbitRingPulse {
      0%,100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
    }

    /* 星球位置 */
    .planet.p1 { top: 25px; left: 50%; transform: translateX(-50%); }
    .planet.p2 { top: 90px; right: 70px; }
    .planet.p3 { top: 220px; right: 25px; }
    .planet.p4 { bottom: 100px; right: 55px; }
    .planet.p5 { bottom: 30px; left: 50%; transform: translateX(-50%); }
    .planet.p6 { bottom: 100px; left: 55px; }
    .planet.p7 { top: 90px; left: 70px; }

    .planet.p1:hover, .planet.p5:hover { transform: translateX(-50%) scale(1.15); }

    /* 连线 */
    .line { position: absolute; background: linear-gradient(90deg, var(--gold), var(--cyan), transparent); height: 1px; transform-origin: left center; opacity: 0.35; }

    /* ========== 右侧面板 ========== */
    .right-panel {
      position: fixed; right: 30px; top: 100px; width: 280px; z-index: 50;
      display: flex; flex-direction: column; gap: 20px;
    }
    .panel-box {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 8px; padding: 20px 16px; backdrop-filter: blur(10px);
    }
    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0, 229, 255, 0.1);
    }
    .panel-title { font-size: 14px; color: var(--cyan); letter-spacing: 1px; }
    .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #22c55e; }
    .status-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .info-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .info-label { color: var(--text-secondary); }
    .info-value { color: var(--cyan); font-weight: 500; }
    .info-value.gold { color: var(--gold); }

    .progress-line { height: 4px; background: rgba(0, 229, 255, 0.15); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); border-radius: 2px; }

    /* ========== 底部模块 ========== */
    .bottom-bar {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 50;
    }
    .bottom-card {
      background: var(--panel-bg); border: 1px solid var(--panel-border);
      border-radius: 6px; padding: 14px 24px; min-width: 135px; text-align: center;
      backdrop-filter: blur(8px); transition: all 0.25s; cursor: pointer;
    }
    .bottom-card:hover { border-color: var(--gold); box-shadow: var(--shadow-gold); transform: translateY(-3px); }
    .bc-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .bc-value { font-size: 15px; color: var(--gold); font-weight: 600; letter-spacing: 1px; }

    /* 装饰角标 */
    .corner { position: absolute; width: 16px; height: 16px; border-color: var(--cyan); border-style: solid; }
    .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    .panel-box, .bottom-card { position: relative; }
    .corner { opacity: 0.4; }
  </style>
</head>
<body>
  <!-- ✨ 星空+星云背景层 -->
  <div class="nebula"></div>
  <div class="stars-layer" id="stars"></div>

  <!-- 🎯 顶部导航 -->
  <header>
    <div class="logo-area">
      <div class="logo-icon"></div>
      <span class="logo-text">SPACE HUNTER</span>
    </div>
    <div class="nav-menu">
      <div class="nav-item active">首页</div>
      <div class="nav-item">雷达扫描</div>
      <div class="nav-item">星球监控</div>
      <div class="nav-item">数据中心</div>
    </div>
    <div class="top-actions">
      <span class="user-text">DASIEORS</span>
      <span class="icon-btn">⚙</span>
      <button class="start-btn">开始扫描</button>
    </div>
  </header>

  <!-- 🟦 左侧面板 -->
  <div class="left-panel">
    <div class="left-menu">
      <div class="left-item"><span class="dot"></span>节点列表</div>
      <div class="left-item active"><span class="dot"></span>节点列表</div>
      <div class="left-item"><span class="dot"></span>信号强度</div>
      <div class="left-item"><span class="dot"></span>能源状态</div>
      <div class="left-item"><span class="dot"></span>能源状态</div>
      <div class="left-item"><span class="dot"></span>告警记录</div>
    </div>
  </div>

  <!-- 🎡 中心雷达区 -->
  <div class="center-area">
    <!-- 轨道 -->
    <div class="orbit-ring orbit-4"></div>
    <div class="orbit-ring orbit-3"></div>
    <div class="orbit-ring orbit-2"></div>
    <div class="orbit-ring orbit-1"></div>

    <!-- 发光旋转环 -->
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>

    <!-- 扫描光束 -->
    <div class="scan-layer"></div>

    <!-- 空间站核心 -->
    <div class="station-core">
      <div class="core-base"><div class="core-inner"></div></div>
    </div>

    <!-- 🪐 星球群 -->
    <div class="planet-wrap">
      <div class="planet p1"><div class="planet-ring"></div></div>
      <div class="planet p2"><div class="planet-ring"></div></div>
      <div class="planet p3"><div class="planet-ring"></div></div>
      <div class="planet p4"><div class="planet-ring"></div></div>
      <div class="planet p5"><div class="planet-ring"></div></div>
      <div class="planet p6"><div class="planet-ring"></div></div>
      <div class="planet p7"><div class="planet-ring"></div></div>
    </div>
  </div>

  <!-- 📊 右侧面板 -->
  <div class="right-panel">
    <div class="panel-box">
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div><div class="corner corner-br"></div>
      <div class="panel-header">
        <span class="panel-title">实时状态</span>
        <span class="status-badge"><span class="status-dot"></span>在线</span>
      </div>
      <div class="info-row"><span class="info-label">在线节点</span><span class="info-value">12</span></div>
      <div class="info-row"><span class="info-label">信号稳定度</span><span class="info-value gold">98%</span></div>
      <div class="progress-line"><div class="progress-fill" style="width:98%"></div></div>
      <div class="info-row" style="margin-top:12px;"><span class="info-label">扫描耗时</span><span class="info-value gold">00:36</span></div>
    </div>

    <div class="panel-box">
      <div class="corner corner-tl"></div><div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div><div class="corner corner-br"></div>
      <div class="panel-header">
        <span class="panel-title">扫描进度</span>
        <span class="status-badge" style="color:var(--cyan)"><span class="status-dot" style="background:var(--cyan)"></span>EAST 扫描中</span>
      </div>
      <div class="info-row"><span class="info-label">已扫描区块</span><span class="info-value">86.4%</span></div>
      <div class="progress-line"><div class="progress-fill" style="width:86.4%"></div></div>
    </div>
  </div>

  <!-- 📌 底部卡片 -->
  <div class="bottom-bar">
    <div class="bottom-card">
      <div class="bc-label">星球基地</div>
      <div class="bc-value">ONLINE</div>
    </div>
    <div class="bottom-card">
      <div class="bc-label">轨道数据</div>
      <div class="bc-value">SYNCED</div>
    </div>
    <div class="bottom-card">
      <div class="bc-label">能源核心</div>
      <div class="bc-value">98.6%</div>
    </div>
    <div class="bottom-card">
      <div class="bc-label">预警等级</div>
      <div class="bc-value">SAFE</div>
    </div>
    <div class="bottom-card">
      <div class="bc-label">预警等级</div>
      <div class="bc-value">NORMAL</div>
    </div>
    <div class="bottom-card">
      <div class="bc-label">系统状态</div>
      <div class="bc-value">RUNNING</div>
    </div>
  </div>

  <script>
    // ✨ 生成星空
    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 200; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 2 + 0.5;
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.animationDelay = Math.random() * 4 + 's';
        star.style.opacity = Math.random() * 0.6 + 0.1;
        container.appendChild(star);
      }
    }

    // � 导航切换
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
      });
    });
    document.querySelectorAll('.left-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.left-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
      });
    });

    window.onload = createStars;
  </script>
</body>
</html>
