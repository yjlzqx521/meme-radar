<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACE HUNTER · 深空扫描系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }

    :root {
      --cyan: #00e5ff;
      --cyan-deep: #0099cc;
      --cyan-dark: #005566;
      --gold: #ffb800;
      --gold-light: #ffd700;
      --gold-deep: #cc8800;
      --panel-bg: rgba(6, 20, 45, 0.7);
      --panel-border-cyan: rgba(0, 229, 255, 0.3);
      --panel-border-gold: rgba(255, 184, 0, 0.3);
      --text-primary: #e6f7ff;
      --text-secondary: #7ab8d6;
      --shadow-cyan: 0 0 20px rgba(0, 229, 255, 0.35);
      --shadow-gold: 0 0 20px rgba(255, 184, 0, 0.35);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #020617;
      position: relative;
      color: var(--text-primary);
    }

    /* 🌌 全屏背景层 — 完美复刻参考图 */
    .bg-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 25%, rgba(80, 120, 255, 0.18) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 150, 180, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(10, 40, 100, 0.15) 0%, transparent 65%),
        linear-gradient(135deg, #020617 0%, #050a20 50%, #03081a 100%);
    }

    /* 星云光效 */
    .nebula {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at 18% 22%, rgba(100, 160, 255, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 75% 65%, rgba(0, 180, 220, 0.08) 0%, transparent 40%);
      animation: nebulaFloat 20s infinite ease-in-out;
    }
    @keyframes nebulaFloat {
      0%,100% { transform: translate(0,0); }
      50% { transform: translate(10px, -5px); }
    }

    /* ✨ 星空粒子 */
    .stars {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none;
    }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle 4s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%,100% { opacity: 0.1; }
      50% { opacity: 1; }
    }

    /* ========== 顶部导航 ========== */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between; padding: 0 45px;
      background: linear-gradient(180deg, rgba(0,15,40,0.8), transparent);
    }

    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--cyan), #66f5ff);
      clip-path: polygon(0 25%, 25% 0, 75% 0, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0 75%);
      box-shadow: var(--shadow-cyan);
    }
    .logo-text { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #fff; text-shadow: 0 0 12px var(--cyan); }

    .nav { display: flex; gap: 50px; margin-left: 40px; }
    .nav-item {
      color: var(--text-secondary); font-size: 15px; cursor: pointer; padding: 6px 0;
      border-bottom: 2px solid transparent; transition: all 0.3s;
      letter-spacing: 1px;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--cyan); border-bottom-color: var(--cyan);
      text-shadow: 0 0 8px var(--cyan);
    }

    .top-right { display: flex; align-items: center; gap: 25px; }
    .user { font-size: 13px; color: var(--text-secondary); }
    .icon { color: var(--text-secondary); cursor: pointer; transition: color 0.2s; }
    .icon:hover { color: var(--cyan); }
    .scan-btn {
      background: linear-gradient(90deg, #00a8cc, var(--cyan));
      border: none; padding: 8px 20px; border-radius: 6px;
      color: #000; font-weight: 600; cursor: pointer;
      box-shadow: 0 0 15px var(--cyan); transition: all 0.3s;
    }
    .scan-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px var(--cyan); }

    /* ========== 左侧面板 ========== */
    .left-panel {
      position: fixed; left: 35px; top: 110px; width: 200px; z-index: 50;
      background: var(--panel-bg); border: 1px solid var(--panel-border-cyan);
      border-radius: 6px; padding: 20px 15px; backdrop-filter: blur(8px);
      box-shadow: inset 0 0 20px rgba(0,229,255,0.03);
    }
    .left-item {
      display: flex; align-items: center; gap: 10px; padding: 11px 14px;
      color: var(--text-secondary); font-size: 14px; border-radius: 4px;
      cursor: pointer; transition: all 0.25s;
      border-left: 3px solid transparent; margin-bottom: 4px;
    }
    .left-item:hover { background: rgba(0,229,255,0.06); color: var(--cyan); }
    .left-item.active {
      background: linear-gradient(90deg, rgba(255,184,0,0.15), rgba(0,229,255,0.05));
      color: var(--gold); border-left-color: var(--gold);
      box-shadow: inset 0 0 10px rgba(255,184,0,0.1);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid currentColor; opacity: 0.6; }
    .left-item.active .dot { background: var(--gold); box-shadow: 0 0 6px var(--gold); opacity: 1; }

    /* ========== 中心雷达空间站 ========== */
    .center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 750px; height: 750px; z-index: 10;
    }

    /* 轨道环 — 多层发光 */
    .orbit {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 1px solid rgba(0,229,255,0.18);
    }
    .o1 { width: 240px; height: 240px; }
    .o2 { width: 360px; height: 360px; }
    .o3 { width: 480px; height: 480px; }
    .o4 { width: 600px; height: 600px; }

    /* 渐变发光环 */
    .glow-orbit {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      border-radius: 50%; border: 1px solid transparent;
      border-image: linear-gradient(90deg, transparent, var(--cyan), transparent) 1;
      animation: rotateGlow 8s linear infinite;
    }
    .g1 { width: 280px; height: 280px; animation-delay: 0s; }
    .g2 { width: 400px; height: 400px; animation-delay: -2s; }
    .g3 { width: 520px; height: 520px; animation-delay: -4s; }
    @keyframes rotateGlow {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* 扫描光束 */
    .scan-beam {
      position: absolute; top: 50%; left: 50%; width: 620px; height: 620px;
      margin-top: -310px; margin-left: -310px; border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(0,229,255,0.4) 0deg,
        rgba(0,229,255,0.08) 25deg,
        transparent 45deg
      );
      animation: scanRotate 5s linear infinite; pointer-events: none;
    }
    @keyframes scanRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* 中心核心 */
    .core {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 200px; height: 200px;
    }
    .core-ring {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid rgba(0,229,255,0.3);
      animation: corePulse 3s infinite ease-in-out;
    }
    .core-ring:nth-child(2) { animation-delay: 0.4s; }
    .core-ring:nth-child(3) { animation-delay: 0.8s; }
    @keyframes corePulse {
      0%,100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 0.2; }
    }
    .core-inner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100px; height: 100px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #66f5ff, #00aacc);
      box-shadow:
        0 0 30px var(--cyan),
        0 0 60px rgba(0,229,255,0.5),
        inset 0 0 20px rgba(255,255,255,0.4);
      animation: coreBright 3s infinite ease-in-out;
    }
    @keyframes coreBright {
      0%,100% { box-shadow: 0 0 30px var(--cyan), 0 0 60px rgba(0,229,255,0.5), inset 0 0 20px rgba(255,255,255,0.4); }
      50% { box-shadow: 0 0 45px var(--cyan), 0 0 90px rgba(0,229,255,0.7), inset 0 0 30px rgba(255,255,255,0.6); }
    }

    /* 🪐 星球 — 复刻参考图 橙金色星球 */
    .planet {
      position: absolute; width: 75px; height: 75px; border-radius: 50%;
      cursor: pointer; transition: all 0.3s ease; z-index: 20;

      /* 参考图同款橙金色星球：暗底+金高光+暖反光 */
      background: radial-gradient(
        circle at 30% 25%,
        #fff9e8 0%,
        #ffd700 15%,
        #ffb800 35%,
        #cc7700 60%,
        #553300 85%,
        #2a1a00 100%
      );

      border: 2px solid rgba(255, 184, 0, 0.5);

      box-shadow:
        0 0 20px rgba(255, 184, 0, 0.45),
        0 0 40px rgba(255, 184, 0, 0.25),
        inset -10px -10px 25px rgba(0, 0, 0, 0.5),
        inset 10px 10px 25px rgba(255, 220, 100, 0.3);
    }
    .planet:hover {
      transform: scale(1.15);
      box-shadow:
        0 0 30px rgba(255, 184, 0, 0.7),
        0 0 60px rgba(255, 184, 0, 0.4),
        inset -10px -10px 25px rgba(0, 0, 0, 0.5),
        inset 10px 10px 25px rgba(255, 220, 100, 0.4);
    }
    .planet.active {
      border-color: #fff;
      box-shadow:
        0 0 30px rgba(255, 215, 0, 0.8),
        0 0 60px rgba(255, 184, 0, 0.5),
        inset -10px -10px 25px rgba(0, 0, 0, 0.5),
        inset 10px 10px 25px rgba(255, 220, 100, 0.4);
    }
    .planet-label {
      position: absolute; top: 105%; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: var(--gold); white-space: nowrap;
      text-shadow: 0 0 6px var(--gold); pointer-events: none;
    }

    /* 星球位置 — 对齐参考图布局 */
    .p1 { top: 10px; left: 50%; transform: translateX(-50%); }
    .p2 { top: 100px; right: 60px; }
    .p3 { top: 220px; right: 20px; }
    .p4 { bottom: 110px; right: 50px; }
    .p5 { bottom: 20px; left: 50%; transform: translateX(-50%); }
    .p6 { bottom: 110px; left: 50px; }
    .p7 { top: 100px; left: 60px; }

    .p1:hover, .p5:hover { transform: translateX(-50%) scale(1.15); }
    .p1.active, .p5.active { transform: translateX(-50%) scale(1); }

    /* ========== 右侧面板 ========== */
    .right-panel {
      position: fixed; right: 40px; top: 100px; width: 290px; z-index: 50;
      display: flex; flex-direction: column; gap: 20px;
    }
    .panel {
      background: var(--panel-bg); border: 1px solid var(--panel-border-cyan);
      border-radius: 6px; padding: 20px 18px; backdrop-filter: blur(8px);
      position: relative; overflow: hidden;
    }
    .panel::before, .panel::after,
    .panel .corner-br::before, .panel .corner-br::after {
      content: ''; position: absolute; width: 12px; height: 12px;
      border-color: var(--cyan); border-style: solid; opacity: 0.4;
    }
    .panel::before { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .panel::after { top: 0; right: 0; border-width: 1px 1px 0 0; }
    .panel .corner-br { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; }
    .panel .corner-br::before { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
    .panel .corner-br::after { bottom: 0; left: 0; border-width: 0 0 1px 1px; }

    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,229,255,0.1); }
    .panel-title { font-size: 14px; color: var(--cyan); letter-spacing: 1px; }
    .status-ok { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #22c55e; }
    .dot-green { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: blink 1.5s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .label { color: var(--text-secondary); }
    .val { color: var(--cyan); font-weight: 500; }
    .val.gold { color: var(--gold); }

    .bar { height: 4px; background: rgba(0,229,255,0.15); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--gold)); border-radius: 2px; transition: width 0.5s ease; }

    /* ========== 底部卡片 ========== */
    .bottom-bar {
      position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 50;
    }
    .b-card {
      background: var(--panel-bg); border: 1px solid var(--panel-border-cyan);
      border-radius: 6px; padding: 14px 20px; min-width: 140px; text-align: center;
      backdrop-filter: blur(8px); cursor: pointer; transition: all 0.3s;
    }
    .b-card:hover { border-color: var(--gold); box-shadow: var(--shadow-gold); transform: translateY(-3px); }
    .b-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .b-val { font-size: 15px; color: var(--gold); font-weight: 600; letter-spacing: 1px; }
  </style>
</head>
<body>
  <!-- 背景层 -->
  <div class="bg-layer"></div>
  <div class="nebula"></div>
  <div class="stars" id="stars"></div>

  <!-- 顶部 -->
  <header>
    <div class="logo">
      <div class="logo-icon"></div>
      <span class="logo-text">SPACE HUNTER</span>
    </div>
    <div class="nav">
      <div class="nav-item active">首页</div>
      <div class="nav-item">雷达扫描</div>
      <div class="nav-item">星球监控</div>
      <div class="nav-item">数据中心</div>
    </div>
    <div class="top-right">
      <span class="user">DASIEORS</span>
      <span class="icon">⚙</span>
      <button class="scan-btn">开始扫描</button>
    </div>
  </header>

  <!-- 左侧 -->
  <div class="left-panel">
    <div class="left-item"><span class="dot"></span>节点列表</div>
    <div class="left-item active"><span class="dot"></span>节点列表</div>
    <div class="left-item"><span class="dot"></span>信号强度</div>
    <div class="left-item"><span class="dot"></span>能源状态</div>
    <div class="left-item"><span class="dot"></span>能源状态</div>
    <div class="left-item"><span class="dot"></span>告警记录</div>
  </div>

  <!-- 中心空间站 -->
  <div class="center">
    <!-- 轨道 -->
    <div class="orbit o4"></div>
    <div class="orbit o3"></div>
    <div class="orbit o2"></div>
    <div class="orbit o1"></div>

    <!-- 发光旋转环 -->
    <div class="glow-orbit g1"></div>
    <div class="glow-orbit g2"></div>
    <div class="glow-orbit g3"></div>

    <!-- 扫描光束 -->
    <div class="scan-beam"></div>

    <!-- 核心 -->
    <div class="core">
      <div class="core-ring"></div>
      <div class="core-ring"></div>
      <div class="core-ring"></div>
      <div class="core-inner"></div>
    </div>

    <!-- 🪐 可点击星球 — 参考图同款橙金色 -->
    <div class="planet p1" data-id="PLANET-01" onclick="clickPlanet(this)">
      <div class="planet-label">SPACS HULINE</div>
    </div>
    <div class="planet p2" data-id="PLANET-02" onclick="clickPlanet(this)">
      <div class="planet-label">实时状态</div>
    </div>
    <div class="planet p3" data-id="PLANET-03" onclick="clickPlanet(this)">
      <div class="planet-label">EAST 节点</div>
    </div>
    <div class="planet p4" data-id="PLANET-04" onclick="clickPlanet(this)">
      <div class="planet-label">SYSTEM-01</div>
    </div>
    <div class="planet p5" data-id="PLANET-05" onclick="clickPlanet(this)">
      <div class="planet-label">SAVR 基地</div>
    </div>
    <div class="planet p6" data-id="PLANET-06" onclick="clickPlanet(this)">
      <div class="planet-label">WEST 节点</div>
    </div>
    <div class="planet p7" data-id="PLANET-07" onclick="clickPlanet(this)">
      <div class="planet-label">NORTH 节点</div>
    </div>
  </div>

  <!-- 右侧面板 -->
  <div class="right-panel">
    <div class="panel" id="status-panel">
      <div class="corner-br"></div>
      <div class="panel-head">
        <span class="panel-title">实时状态</span>
        <span class="status-ok"><span class="dot-green"></span>在线</span>
      </div>
      <div class="row"><span class="label">在线节点</span><span class="val gold" id="p-node">12</span></div>
      <div class="row"><span class="label">信号稳定度</span><span class="val gold" id="p-signal">98%</span></div>
      <div class="bar"><div class="fill" id="p-bar1" style="width:98%"></div></div>
      <div class="row" style="margin-top:12px;"><span class="label">当前选中</span><span class="val" id="p-planet">未选择</span></div>
    </div>

    <div class="panel">
      <div class="corner-br"></div>
      <div class="panel-head">
        <span class="panel-title">扫描进度</span>
        <span class="status-ok" style="color:var(--cyan)"><span class="dot-green" style="background:var(--cyan)"></span>扫描中</span>
      </div>
      <div class="row"><span class="label">已扫描区块</span><span class="val">86.4%</span></div>
      <div class="bar"><div class="fill" style="width:86.4%"></div></div>
      <div class="row" style="margin-top:10px;"><span class="label">耗时</span><span class="val gold">00:36</span></div>
    </div>
  </div>

  <!-- 底部卡片 -->
  <div class="bottom-bar">
    <div class="b-card">
      <div class="b-label">星球基地</div>
      <div class="b-val">ONLINE</div>
    </div>
    <div class="b-card">
      <div class="b-label">轨道数据</div>
      <div class="b-val">SYNCED</div>
    </div>
    <div class="b-card">
      <div class="b-label">能源核心</div>
      <div class="b-val">98.6%</div>
    </div>
    <div class="b-card">
      <div class="b-label">预警等级</div>
      <div class="b-val">SAFE</div>
    </div>
    <div class="b-card">
      <div class="b-label">预警等级</div>
      <div class="b-val">NORMAL</div>
    </div>
    <div class="b-card">
      <div class="b-label">系统状态</div>
      <div class="b-val">RUNNING</div>
    </div>
  </div>

  <script>
    // ✨ 生成星空
    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 200; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2 + 0.5;
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.animationDelay = Math.random() * 4 + 's';
        container.appendChild(s);
      }
    }

    // 🪐 星球点击交互
    function clickPlanet(el) {
      // 取消其他选中
      document.querySelectorAll('.planet').forEach(p => p.classList.remove('active'));
      // 选中当前
      el.classList.add('active');
      // 更新右侧面板
      const id = el.getAttribute('data-id');
      const label = el.querySelector('.planet-label').textContent;
      document.getElementById('p-planet').textContent = label + ' (' + id + ')';
      // 模拟随机数据
      const nodeCount = Math.floor(Math.random() * 6) + 10;
      const signal = Math.floor(Math.random() * 5) + 94;
      document.getElementById('p-node').textContent = nodeCount;
      document.getElementById('p-signal').textContent = signal + '%';
      document.getElementById('p-bar1').style.width = signal + '%';
    }

    // 导航切换
    document.querySelectorAll('.nav-item').forEach(n => {
      n.addEventListener('click', () => {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        n.classList.add('active');
      });
    });
    document.querySelectorAll('.left-item').forEach(n => {
      n.addEventListener('click', () => {
        document.querySelectorAll('.left-item').forEach(i => i.classList.remove('active'));
        n.classList.add('active');
      });
    });

    window.onload = createStars;
  </script>
</body>
</html>
