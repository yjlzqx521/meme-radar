<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>土狗扫描台 · 最终纯净版</title>
<style>
:root {
  --bg-main: #0a0e27;
  --bg-card: #101636;
  --bg-row: rgba(16, 22, 54, 0.6);
  --accent-cyan: #00d4ff;
  --ok: #00e080;
  --warn: #ffcc00;
  --danger: #ff4455;
  --text-primary: #e6f0ff;
  --text-secondary: #7a8ab8;
  --avatar-size: 48px;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body {
  background: radial-gradient(circle at top left, #141d42, #0a0e27 60%);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 20px;
}
.container { max-width: 1100px; margin: 0 auto; }

.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
}
h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
.ctrl-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  background: rgba(0, 212, 255, 0.08); border: 1px solid rgba(0, 212, 255, 0.2);
  color: var(--accent-cyan); padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: 0.25s; font-size: 0.85rem;
}
.btn:hover { background: rgba(0, 212, 255, 0.15); }
.sound-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; cursor: pointer; }
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #1e2548; border-radius: 22px; transition: 0.3s;
}
.slider:before {
  content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px;
  background: white; border-radius: 50%; transition: 0.3s;
}
input:checked + .slider { background: var(--ok); }
input:checked + .slider:before { transform: translateX(18px); }

.banner {
  background: rgba(0, 212, 255, 0.05); border: 1px solid rgba(0, 212, 255, 0.15);
  border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 0.85rem;
}
.banner strong { color: var(--accent-cyan); }

.table-header {
  display: grid;
  grid-template-columns: 56px 110px 1fr 110px 110px 130px;
  gap: 10px; padding: 8px 12px; color: var(--text-secondary); font-size: 0.75rem;
  border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px;
}

.row {
  display: grid;
  grid-template-columns: 56px 110px 1fr 110px 110px 130px;
  gap: 10px; padding: 12px; margin-bottom: 8px;
  background: var(--bg-row); border-radius: var(--radius); align-items: center;
  position: relative; overflow: hidden;
  opacity: 0; transform: translateX(20px); transition: all 0.4s ease;
  border: 1px solid transparent;
}
.row.visible { opacity: 1; transform: translateX(0); }
.row:hover { background: rgba(20, 28, 68, 0.8); border-color: rgba(255,255,255,0.06); }

/* 流光入场 */
.row::before {
  content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
}
.row.new-in::before {
  left: 100%; transition: left 0.7s ease;
}

/* 头像区 */
.avatar-wrap { position: relative; display: flex; justify-content: center; }
.avatar {
  width: var(--avatar-size); height: var(--avatar-size); border-radius: 50%;
  object-fit: cover; background: #1e2548; border: 2px solid rgba(255,255,255,0.1);
  transition: transform 0.3s ease;
}
.avatar-ring {
  position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent;
  opacity: 0; transition: all 0.4s ease;
}

/* ========== 三级呼吸动效 ========== */
/* 普通可进 —— 标准呼吸 */
.row.ok .avatar-ring {
  border-color: var(--ok); opacity: 1;
  animation: pulseNormal 2.2s infinite;
}
/* 共振 —— 加强呼吸 */
.row.resonance .avatar-ring {
  border-color: var(--accent-cyan); border-width: 3px; opacity: 1;
  animation: pulseStrong 1.6s infinite;
}
.row.resonance .avatar {
  transform: scale(1.05);
}
/* 强共振 —— 高亮+放大+高频呼吸 */
.row.strong-res .avatar-ring {
  border-color: var(--accent-cyan); border-width: 3px; opacity: 1;
  animation: pulseBright 1.2s infinite;
  box-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
}
.row.strong-res .avatar {
  transform: scale(1.1);
}
/* 观察 —— 柔和慢呼吸 */
.row.warn .avatar-ring {
  border-color: var(--warn); opacity: 1;
  animation: pulseSlow 3s infinite;
}
/* 回避 —— 静态边框，不呼吸不抢 */
.row.danger .avatar-ring {
  border-color: var(--danger); opacity: 0.7;
  animation: none;
}

@keyframes pulseNormal {
  0% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(0, 224, 128, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 224, 128, 0); }
}
@keyframes pulseSlow {
  0% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.25); }
  70% { box-shadow: 0 0 0 6px rgba(255, 204, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(255, 204, 0, 0); }
}
@keyframes pulseStrong {
  0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.45); }
  70% { box-shadow: 0 0 0 10px rgba(0, 212, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
}
@keyframes pulseBright {
  0% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.6); }
  50% { box-shadow: 0 0 0 14px rgba(0, 212, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0); }
}

.coin-name { font-weight: 600; font-size: 1rem; }
.coin-full { font-size: 0.7rem; color: var(--text-secondary); opacity: 0; height: 0; overflow: hidden; transition: all 0.25s ease; }
.row:hover .coin-full { opacity: 1; height: auto; margin-top: 2px; }
.addr { font-family: monospace; font-size: 0.75rem; color: var(--text-secondary); margin-top: 3px; }

.cap { font-family: monospace; font-size: 1rem; font-weight: 500; }
.cap.up { color: var(--ok); }
.cap.down { color: var(--danger); }

.status-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 16px;
  font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.25s;
}
.status-tag.ok { background: rgba(0, 224, 128, 0.1); color: var(--ok); border: 1px solid rgba(0, 224, 128, 0.2); }
.status-tag.warn { background: rgba(255, 204, 0, 0.08); color: var(--warn); border: 1px solid rgba(255, 204, 0, 0.18); }
.status-tag.danger { background: rgba(255, 68, 85, 0.1); color: var(--danger); border: 1px solid rgba(255, 68, 85, 0.2); }
.res-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 8px; background: rgba(0, 212, 255, 0.12); color: var(--accent-cyan); margin-left: 4px; }
.res-badge.strong { background: rgba(0, 212, 255, 0.2); box-shadow: 0 0 6px rgba(0, 212, 255, 0.3); }

.detail-row {
  grid-column: 1 / -1; background: rgba(8, 12, 32, 0.7); border-radius: 10px; margin-top: 8px; padding: 14px;
  display: none; font-size: 0.85rem; line-height: 1.7;
}
.row.expanded .detail-row { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

@media (max-width: 850px) {
  .table-header, .row { grid-template-columns: 56px 100px 1fr 100px 100px; }
  .table-header span:nth-child(6), .row > div:nth-child(6) { display: none; }
}
@media (max-width: 550px) {
  .table-header, .row { grid-template-columns: 56px 100px 1fr 100px; }
  .table-header span:nth-child(5), .row > div:nth-child(5) { display: none; }
  :root { --avatar-size: 42px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="top-bar">
    <h1>🚀 土狗扫描台</h1>
    <div class="ctrl-group">
      <label class="sound-label">
        🔊 声音提醒
        <label class="switch">
          <input type="checkbox" id="soundSwitch" checked>
          <span class="slider"></span>
        </label>
      </label>
      <button class="btn" id="clearBtn">清提醒</button>
    </div>
  </div>

  <div class="banner">
    <div>📡 监控源：<strong id="sourceCount">24</strong> 个 · 扫描中 · 盯币：<strong id="watchCount">0</strong></div>
    <div>过闸率：<strong>73%</strong> · 拦截风险：<strong id="blockCount">22</strong> 个</div>
  </div>

  <div class="table-header">
    <span>头像</span>
    <span>币种</span>
    <span>合约地址</span>
    <span>市值</span>
    <span>状态</span>
    <span>信号</span>
  </div>

  <div id="listContainer"></div>
</div>

<script>
// ========== 全部配置与策略完整保留 ==========
const CONFIG = {
  SOUND_ENABLED: true,
  POOL_RATIO_OK: 45,
  BS_RATIO_OK: 1.5,
  RESONANCE_OK: 2,
  RESONANCE_STRONG: 3,
  NOTIFY_COOLDOWN: 3600000,
  HIGHLIGHT_DURATION: 5000,
  TAKE_PROFIT_1: 50,
  TP1_RATIO: 0.25,
  TAKE_PROFIT_2: 100,
  TP2_RATIO: 0.5,
  STOP_LOSS: -15,
  MAX_POSITION: 50,
  MAX_COINS: 3
};

// 头像库 —— 可继续添加
const AVATAR_LIBRARY = {
  BTC: 'https://assets.coingecko.com/coins/images/1/small/bitcoin.png',
  ETH: 'https://assets.coingecko.com/coins/images/279/small/ethereum.png',
  SOL: 'https://assets.coingecko.com/coins/images/4128/small/solana.png',
  BNB: 'https://assets.coingecko.com/coins/images/825/small/bnb-icon2_2x.png',
  USDT: 'https://assets.coingecko.com/coins/images/325/small/Tether.png',
  PEPE: 'https://assets.coingecko.com/coins/images/29851/small/pepe.png',
  WIF: 'https://assets.coingecko.com/coins/images/33697/small/wif.png',
  BONK: 'https://assets.coingecko.com/coins/images/30868/small/bonk.png',
  SHIB: 'https://assets.coingecko.com/coins/images/11938/small/shib.png',
  DOGE: 'https://assets.coingecko.com/coins/images/5/small/dogecoin.png',
  DEFAULT: 'https://cdn-icons-png.flaticon.com/512/1046/1046754.png'
};

const notified = new Map();
const synth = window.speechSynthesis;
let audioCtx = null;
let coinList = [];

// ========== 音频系统 ==========
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playTone(freq = 880, dur = 0.2) {
  if (!CONFIG.SOUND_ENABLED || !audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, audioCtx.currentTime);
  g.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.03);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.start(audioCtx.currentTime);
  o.stop(audioCtx.currentTime + dur);
}
function speak(text) {
  if (!CONFIG.SOUND_ENABLED || synth.speaking) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-CN'; u.volume = 0.7; u.rate = 1.05;
  synth.speak(u);
}

// ========== 提醒系统 ==========
function notifyItem(item) {
  const now = Date.now();
  if (notified.has(item.id) && now - notified.get(item.id) < CONFIG.NOTIFY_COOLDOWN) return;
  notified.set(item.id, now);

  if (item.sourceCount >= CONFIG.RESONANCE_STRONG) {
    playTone(960); setTimeout(() => playTone(1200), 150);
    setTimeout(() => speak(`强共振信号，${item.symbol}`), 400);
  } else if (item.sourceCount >= CONFIG.RESONANCE_OK) {
    playTone(920);
    setTimeout(() => speak(`新币${item.symbol}，共振信号`), 300);
  } else if (item.status === 'ok') {
    playTone(880);
    setTimeout(() => speak(`新币${item.symbol}，可关注`), 300);
  } else if (item.status === 'warn') {
    playTone(620);
    setTimeout(() => speak(`${item.symbol}，观察走势`), 250);
  } else {
    playTone(380, 0.3);
    setTimeout(() => speak(`${item.symbol}，风险回避`), 250);
  }
}

// ========== 风控判定系统 ==========
function evaluateCoin(item) {
  const { poolRatio, bsRatio, isPixi, isHighRise, hasValidNarrative, sourceCount = 1 } = item;
  const checks = {
    pool: poolRatio >= CONFIG.POOL_RATIO_OK,
    bs: bsRatio >= CONFIG.BS_RATIO_OK,
    notPixi: !isPixi,
    notHigh: !isHighRise,
    narrative: hasValidNarrative !== false
  };
  const passCount = Object.values(checks).filter(Boolean).length;
  const isResonance = sourceCount >= CONFIG.RESONANCE_OK;
  const isStrongRes = sourceCount >= CONFIG.RESONANCE_STRONG;

  let status, label, tagClass;
  if (passCount === 5 || (passCount >= 4 && isResonance)) {
    status = 'ok'; label = '🟢 共振可进'; tagClass = 'ok';
  } else if (passCount >= 3 && poolRatio >= 20) {
    status = 'warn'; label = '⏳ 观察'; tagClass = 'warn';
  } else {
    status = 'danger'; label = '🚫 回避'; tagClass = 'danger';
  }

  return { status, label, tagClass, checks, passCount, isResonance, isStrongRes };
}

// ========== 工具函数 ==========
function formatNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(2) + 'K';
  return n.toFixed(2);
}
function formatAddress(s) {
  if (!s) return '';
  return s.slice(0, 6) + '…' + s.slice(-4);
}
function getAvatar(item) {
  if (item.avatarUrl) return item.avatarUrl;
  return AVATAR_LIBRARY[item.symbol.toUpperCase()] || AVATAR_LIBRARY.DEFAULT;
}
function animateNumber(el, from, to) {
  const dur = 800, start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / dur);
    el.textContent = '$' + formatNumber(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ========== 渲染行 ==========
function createRow(item, isNew = false) {
  const evalResult = evaluateCoin(item);
  Object.assign(item, evalResult);

  const row = document.createElement('div');
  row.className = `row ${item.tagClass}`;
  if (item.isResonance) row.classList.add('resonance');
  if (item.isStrongRes) row.classList.add('strong-res');
  if (isNew) row.classList.add('new-in');
  row.dataset.id = item.id;

  const capClass = item.priceChange > 5 ? 'up' : item.priceChange < -5 ? 'down' : '';

  // 信号徽章
  let signalBadge = '';
  if (item.isStrongRes) {
    signalBadge = '<span class="res-badge strong">🔥 强共振</span>';
  } else if (item.isResonance) {
    signalBadge = `<span class="res-badge">共${item.sourceCount}源</span>`;
  } else {
    signalBadge = '<span style="color:var(--text-secondary);font-size:0.75rem">单源信号</span>';
  }

  row.innerHTML = `
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <img class="avatar" src="${getAvatar(item)}" alt="${item.symbol}" loading="lazy">
    </div>
    <div>
      <div class="coin-name">${item.symbol} <span style="color:var(--text-secondary);font-size:0.8rem">${item.chain}</span></div>
      <div class="coin-full">${item.fullName || item.symbol} · 点击展开详情</div>
      <div class="addr" title="${item.address}">${formatAddress(item.address)}</div>
    </div>
    <div></div>
    <div class="cap ${capClass}" data-val="${item.marketCap}">$0</div>
    <div>
      <div class="status-tag ${item.tagClass}" title="点击展开详情">
        ${item.label} ▾
      </div>
      <div class="detail-row">
        <div style="margin-bottom:10px"><strong>判定依据：</strong>${item.label.replace(/[🟢⏳🚫]/g, '').trim()}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div>池资金：${item.poolRatio}% ${item.checks.pool?'✅':'❌'}</div>
          <div>买卖比：${item.bsRatio} ${item.checks.bs?'✅':'❌'}</div>
          <div>非貔貅：${item.checks.notPixi?'✅':'❌'}</div>
          <div>非高位：${item.checks.notHigh?'✅':'❌'}</div>
          <div>项目背景：${item.checks.narrative?'✅':'❌'}</div>
          <div>信号来源：${item.sourceCount||1} 个</div>
        </div>
        ${item.remark?`<div style="margin-bottom:10px;color:var(--accent-cyan)">💡 ${item.remark}</div>`:''}
        <div style="background:rgba(0,212,255,0.05);padding:12px;border-radius:10px;margin-bottom:10px">
          <div style="font-weight:600;margin-bottom:6px">🎯 止盈止损策略</div>
          <div>上涨 +${CONFIG.TAKE_PROFIT_1}% → 卖出 ${CONFIG.TP1_RATIO*100}% 仓位</div>
          <div>上涨 +${CONFIG.TAKE_PROFIT_2}% → 卖出 ${CONFIG.TP2_RATIO*100}% 仓位</div>
          <div>下跌 ${CONFIG.STOP_LOSS}% → 全部止损离场</div>
          <div style="margin-top:6px;color:var(--accent-cyan)">建议单笔不超过 $${CONFIG.MAX_POSITION}，同时持有不超过 ${CONFIG.MAX_COINS} 个币种</div>
        </div>
        <div>
          🔗 快速核验：
          ${item.explorer?`<a href="${item.explorer}" target="_blank" style="color:var(--accent-cyan);margin-right:12px">链上合约›</a>`:''}
          ${item.website?`<a href="${item.website}" target="_blank" style="color:var(--accent-cyan)">项目官网›</a>`:''}
        </div>
      </div>
    </div>
    <div>${signalBadge}</div>
  `;

  // 入场动画时序
  setTimeout(() => row.classList.add('visible'), 10);
  if (isNew) {
    setTimeout(() => row.classList.remove('new-in'), CONFIG.HIGHLIGHT_DURATION);
  }

  // 数字滚动
  requestAnimationFrame(() => {
    const capEl = row.querySelector('.cap');
    animateNumber(capEl, 0, item.marketCap);
  });

  // 展开详情
  row.querySelector('.status-tag').addEventListener('click', () => {
    row.classList.toggle('expanded');
  });

  // 新币提醒
  if (isNew) notifyItem(item);

  return row;
}

// ========== 渲染列表 ==========
const listContainer = document.getElementById('listContainer');

function renderList(data, isNew = false) {
  listContainer.innerHTML = '';
  data.forEach(item => {
    const isNewCoin = isNew && !notified.has(item.id);
    listContainer.appendChild(createRow(item, isNewCoin));
  });
  document.getElementById('watchCount').textContent = data.length;
  coinList = [...data];
}

// ========== 示例数据 —— 替换为真实接口即可 ==========
const sampleData = [
  {
    id: 'btc-001', symbol: 'BTC', fullName: 'Bitcoin', chain: 'BSC',
    address: '0x22aa826bdf1234567890abcdef1234567777',

    isPixi: false, isHighRise: false, hasValidNarrative: true,
    sourceCount: 2, remark: '主流币共振，资金持续流入',
    explorer: 'https://bscscan.com/address/0x22aa826bdf1234567890abcdef1234567777'
  },
  {
    id: 'sol-002', symbol: 'SOL', fullName: 'Solana', chain: 'SOL',
    address: '0x33bb937ce41234567890abcdef1234568888',
    marketCap: 5320, poolRatio: 32, bsRatio: 1.2, priceChange: 3.1,
    isPixi: false, isHighRise: false, hasValidNarrative: true,
    sourceCount: 1, remark: '池资金偏低，观察资金变化',
    explorer: 'https://solscan.io/'
  },
  {

    marketCap: 11320, poolRatio: 58, bsRatio: 2.3, priceChange: 12.5,
    isPixi: false, isHighRise: false, hasValidNarrative: true,
    sourceCount: 3, remark: '🔥 强共振信号，多源同时捕获',
    explorer: 'https://solscan.io/'
  },
  {
    id: 'shib-004', symbol: 'SHIB', fullName: 'Shiba Inu', chain: 'BSC',
    address: '0x55dd159ef61234567890abcdef1234560000',
    marketCap: 16600, poolRatio: 48, bsRatio: 1.8, priceChange: -3.2,
    isPixi: false, isHighRise: false, hasValidNarrative: true,
    sourceCount: 2, remark: '共振信号，注意回调风险',
    explorer: 'https://bscscan.com/'
  },
  {
    id: 'dog-005', symbol: 'DOG', fullName: 'Unknown Meme', chain: 'BSC',

    isPixi: true, isHighRise: false, hasValidNarrative: false,
    sourceCount: 0, remark: '⚠️ 检测到貔貅合约，禁止买入',

  }

// ========== 事件绑定 ==========
